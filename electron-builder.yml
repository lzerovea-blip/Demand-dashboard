appId: com.local.healthroadmap
productName: 解决方案需求管理
compression: maximum
directories:
  output: release
files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json
extraResources:
  - from: build-resources/app-icon.png
    to: app-icon.png
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
  - from: 需求路标模板-共创版-v0.1.pptx
    to: templates/需求路标模板-共创版-v0.1.pptx
mac:
  icon: build-resources/app-icon.icns
  category: public.app-category.business
  target:
    - dmg
    - zip
win:
  extraResources:
    - from: dist-mcp/server.cjs
      to: mcp/server.cjs
    - from: build-resources/mcp-runtime/win32-x64
      to: mcp
  icon: build-resources/app-icon.ico
  electronLanguages:
    - zh-CN
    - en-US
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "Solution-Requirements-Manager-Setup-${version}-${arch}.${ext}"
portable:
  artifactName: "Solution-Requirements-Manager-Portable-${version}-${arch}.${ext}"
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
